name = "thebiggooberwebsite"
main = "worker/worker.js"
compatibility_date = "2026-05-28"

routes = [
  { pattern = "thebiggooberwebsite.com/api/*", zone_name = "thebiggooberwebsite.com" },
  { pattern = "thebiggooberwebsite.com/lab", zone_name = "thebiggooberwebsite.com" },
  { pattern = "thebiggooberwebsite.com/lab/*", zone_name = "thebiggooberwebsite.com" }
]

# The lab game pages are bundled into the Worker (never served from public/).
# Globs match the import string in lab/server.js, e.g. "./web/app.js".
[[rules]]
type = "Text"
globs = ["./web/*.html", "./web/*.css", "./web/*.js"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["./web/*.png"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "thebiggooberwebsite-db"
database_id = "58f2457b-a74c-4370-9ad7-bc43067048af"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "GOOBER_IMAGES"
bucket_name = "thebiggooberwebsite-images"

[[durable_objects.bindings]]
name = "CARD_BATTLE_ROOMS"
class_name = "CardBattleRoom"

[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "Matchmaker"

[[durable_objects.bindings]]
name = "PRESENCE"
class_name = "Presence"

[[durable_objects.bindings]]
name = "LAB_ROOMS"
class_name = "LabRoom"

[[migrations]]
tag = "v1-card-battle-rooms"
new_sqlite_classes = ["CardBattleRoom"]

[[migrations]]
tag = "v2-matchmaker"
new_sqlite_classes = ["Matchmaker"]

[[migrations]]
tag = "v3-presence"
new_sqlite_classes = ["Presence"]

[[migrations]]
tag = "v4-lab"
new_sqlite_classes = ["LabRoom"]

# Workers AI powers the upload auto-moderator.
[ai]
binding = "AI"
